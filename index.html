<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilgin Şenol</title>
  <meta name="description" content="Personal homepage of Bilgin Şenol.">
  <style>
    :root { --fg: #1a1a1a; --muted: #666; --accent: #2b6cb0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 2.5rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    p.tagline { color: var(--muted); margin: 0 0 2rem; font-size: 1.05rem; }
    nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    nav a:hover { border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Bilgin Şenol</h1>
    <p class="tagline">Personal homepage</p>
    <nav>
      <a href="/tptf/">TPTF &rarr;</a>
    </nav>
  </main>
</body>
</html>
